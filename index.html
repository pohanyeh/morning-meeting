<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>眼科晨會行事曆</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--line:#374151;--text:#f9fafb;--muted:#cbd5e1;--accent:#93c5fd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.5}
main{max-width:1500px;margin:auto;padding:26px 22px 50px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:18px}h1{font-size:clamp(22px,3vw,30px);margin:0}h2{font-size:17px;margin:0 0 14px}.sub{color:var(--muted);font-size:13px;margin:3px 0 0}.controls{display:flex;align-items:center;gap:10px}select{background:#273449;color:#fff;border:1px solid #607087;border-radius:8px;padding:10px 14px;font-size:15px;min-width:145px}section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;min-width:0}.scroll{overflow-x:auto}table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left}th{font-weight:650;color:#e5e7eb;background:#2b3748}tr:last-child td{border-bottom:0}.calendar{table-layout:fixed;min-width:620px}.calendar th:first-child{width:95px}.calendar td{height:115px;vertical-align:top;border-right:1px solid var(--line)}.calendar td:last-child{border-right:0}.calendar .week{color:#d1d5db;font-weight:650;vertical-align:middle;background:#253142}.date{font-size:12px;color:#cbd5e1;margin-bottom:8px}.meeting{padding:10px;border-radius:8px;color:#111827;min-height:74px;overflow-wrap:anywhere}.meeting-title{font-weight:700;font-size:13px}.doctor{display:inline-block;margin-top:7px;padding:2px 7px;border-radius:5px;color:#fff;font-size:12px;font-weight:700}.empty{color:#64748b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stats section{margin:0}.number{text-align:right;font-variant-numeric:tabular-nums}.name-chip{display:inline-block;padding:3px 8px;border-radius:6px;font-weight:650;color:#fff}.summary{font-size:13px;color:var(--muted);margin-top:12px}.error{padding:14px;background:#4b2525;border:1px solid #a65c5c;border-radius:8px}.legend{color:var(--muted);font-size:12px;margin-top:8px}@media(max-width:780px){main{padding:16px 12px}.stats{grid-template-columns:1fr}section{padding:13px}.calendar td{padding:8px}.calendar th:first-child{width:70px}}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{background:#273449;border:1px solid #4b607a;color:#e5e7eb;padding:10px 17px;border-radius:9px;font-weight:650;cursor:pointer}.tab[aria-selected="true"]{background:#2563eb;border-color:#60a5fa;color:#fff}.tab:focus-visible{outline:3px solid #93c5fd}.panel[hidden]{display:none!important}.filterbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.filterbar label{display:flex;align-items:center;gap:8px}.filtered-note{color:var(--muted);font-size:13px;margin:10px 0}.empty-row{text-align:center;color:var(--muted)}
.stats-subtotal td{background:#273449;border-top:1px solid #64748b}.stats-grandtotal td{background:#334155;border-top:2px solid #94a3b8}
</style>
</head>
<body><main>
<header><div><h1>眼科晨會行事曆</h1><p class="sub">每週二、三、四 · 2026/12–2027/06</p></div></header>
<nav class="tabs" role="tablist" aria-label="排程功能">
<button class="tab" id="tab-calendar" role="tab" aria-controls="panel-calendar" aria-selected="true" tabindex="0" data-tab="calendar">每週行事曆</button>
<button class="tab" id="tab-meetings" role="tab" aria-controls="panel-meetings" aria-selected="false" tabindex="-1" data-tab="meetings">會議清單</button>
<button class="tab" id="tab-doctors" role="tab" aria-controls="panel-doctors" aria-selected="false" tabindex="-1" data-tab="doctors">醫師統計</button>
</nav>
<div id="status" class="sub" role="status">正在載入排程…（網站修正版 2）</div>
<div class="panel" id="panel-calendar" role="tabpanel" aria-labelledby="tab-calendar">
<div class="filterbar"><label for="month">月份 <select id="month" aria-label="行事曆月份"></select></label></div>
<section aria-label="每週行事曆"><h2>每週晨會行事曆</h2><div class="scroll"><table class="calendar"><thead><tr><th>週次</th><th>星期二</th><th>星期三</th><th>星期四</th></tr></thead><tbody id="calendarBody"></tbody></table></div><div class="legend">會議與醫師顏色沿用 Python 排程設定。</div></section>
<div class="stats"><section><h2>本月各會議數量</h2><div class="scroll"><table><thead><tr><th>會議種類</th><th class="number">場次</th></tr></thead><tbody id="typeBody"></tbody></table></div><p class="summary" id="typeSummary"></p></section><section><h2>本月各醫師場次</h2><div class="scroll"><table><thead><tr><th>醫師姓名</th><th class="number">全部場次</th><th class="number">平均分配計數</th></tr></thead><tbody id="doctorBody"></tbody></table></div><p class="summary">平均分配計數不含科事務會議及 RRC 會議。</p></section></div>
</div>
<div class="panel" id="panel-meetings" role="tabpanel" aria-labelledby="tab-meetings" hidden>
<section><h2>會議清單</h2><div class="filterbar"><label for="meetingType">會議種類 <select id="meetingType"></select></label><label for="meetingMonth">月份 <select id="meetingMonth"></select></label></div>
<p class="filtered-note" id="meetingCount"></p><div class="scroll"><table><thead><tr><th>日期</th><th>會議種類</th><th>負責醫師</th></tr></thead><tbody id="meetingListBody"></tbody></table></div></section>
</div>
<div class="panel" id="panel-doctors" role="tabpanel" aria-labelledby="tab-doctors" hidden>
<section><h2>醫師統計</h2><div class="filterbar"><label for="statsDoctor">醫師 <select id="statsDoctor"></select></label><label for="statsMonth">統計期間 <select id="statsMonth"></select></label></div>
<p class="filtered-note" id="statsCount"></p><div class="scroll"><table><thead><tr><th>醫師姓名</th><th>會議種類</th><th class="number">場次</th><th class="number">平均分配合計</th></tr></thead><tbody id="statsBody"></tbody></table></div><p class="summary">平均分配合計不包含科事務會議、RRC 會議及停會。</p></section>
</div>
</main>
<script>
'use strict';
const DEFAULT_ORDER=['科事務會議','RRC會議','影像討論','VS research meeting','綜合大會','Case & Clinical pearls','Video','TransPRK教學','專題演講','停會'];
const OLD_CASE_TYPES=new Set(['病例討論','臨床病例討論','臨床教學','文獻討論','核心課程','病例/期刊論文討論']);
const normalize=t=>OLD_CASE_TYPES.has(t)?'Video':({'科事務會議':'科事務會議','併發症討論':'綜合大會','VS Research Meeting':'VS research meeting'}[t]||t);
const isActive=e=>e&&normalize(e.type)!=='停會'&&e.doctor_id!==null&&e.doctor_id!==undefined&&e.doctor_id!=='';
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeColor=(v,fallback)=>typeof v==='string'&&/^#[0-9a-fA-F]{3,8}$/.test(v)?v:fallback;
const pad=n=>String(n).padStart(2,'0');
const dateKey=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const $=id=>document.getElementById(id);
let schedule;
const meetingTypes=()=>[...new Set([...DEFAULT_ORDER,...(schedule.meeting_order||[]).map(normalize),...schedule.meetings.map(e=>normalize(e.type))])].sort(typeSort);
function typeSort(a,b){const ai=DEFAULT_ORDER.indexOf(a),bi=DEFAULT_ORDER.indexOf(b);return (ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b,'zh-Hant')}
function nameOf(e){return schedule.doctors?.[e.doctor_id]||e.doctor_name||e.doctor_id||''}
function doctorChip(e){if(!isActive(e))return '—';const c=safeColor(schedule.doctor_colors?.[e.doctor_id],'#334155');return `<span class="name-chip" style="background:${c}">${escapeHTML(nameOf(e))}</span>`}
function renderMeetings(){const t=$('meetingType').value,m=$('meetingMonth').value;const rows=schedule.meetings.filter(e=>(t==='全部'||normalize(e.type)===t)&&(m==='全部'||e.date.startsWith(m))).sort((a,b)=>a.date.localeCompare(b.date));$('meetingCount').textContent=`共 ${rows.filter(isActive).length} 場`; $('meetingListBody').innerHTML=rows.map(e=>`<tr><td>${escapeHTML(e.date)}</td><td>${escapeHTML(normalize(e.type))}</td><td>${doctorChip(e)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty-row">此篩選條件沒有會議</td></tr>'}
function renderDoctorStats(){
 const selected=$('statsDoctor').value,month=$('statsMonth').value;
 const rows=schedule.meetings.filter(e=>isActive(e)&&(selected==='全部'||e.doctor_id===selected)&&(month==='全部'||e.date.startsWith(month)));
 const doctorIds=selected==='全部'?[...new Set([...Object.keys(schedule.doctors||{}),...rows.filter(isActive).map(e=>e.doctor_id)])].sort():[selected];
 const excluded=new Set(['RRC會議','科事務會議']);
 let html='',grandTotal=0,grandFair=0;
 for(const id of doctorIds){
  const doctorRows=rows.filter(e=>e.doctor_id===id);
  const types=new Map();
  for(const e of doctorRows){const t=normalize(e.type);types.set(t,(types.get(t)||0)+1)}
  const fair=doctorRows.filter(e=>!excluded.has(normalize(e.type))).length;
  grandTotal+=doctorRows.length;grandFair+=fair;
  const color=safeColor(schedule.doctor_colors?.[id],'#334155');
  const name=schedule.doctors?.[id]||doctorRows[0]?.doctor_name||id;
  const chip=`<span class="name-chip" style="background:${color}">${escapeHTML(name)}</span>`;
  for(const [type,count] of [...types.entries()].sort((a,b)=>typeSort(a[0],b[0]))){
   html+=`<tr><td>${chip}</td><td>${escapeHTML(type)}</td><td class="number">${count}</td><td class="number">—</td></tr>`;
  }
  html+=`<tr class="stats-subtotal"><td>${chip}</td><td><strong>小計（扣除 RRC、科事務）</strong></td><td class="number"><strong>${doctorRows.length}</strong></td><td class="number"><strong>${fair}</strong></td></tr>`;
 }
 if(selected==='全部')html+=`<tr class="stats-grandtotal"><td><strong>所有醫師合計</strong></td><td>扣除 RRC、科事務</td><td class="number"><strong>${grandTotal}</strong></td><td class="number"><strong>${grandFair}</strong></td></tr>`;
 $('statsBody').innerHTML=html||'<tr><td colspan="4" class="empty-row">此篩選條件沒有會議</td></tr>';
 $('statsCount').textContent=`全部場次 ${grandTotal} 場；扣除 RRC、科事務後 ${grandFair} 場；${new Set(rows.map(e=>e.doctor_id)).size} 位醫師`;
}
function showTab(tab){for(const b of document.querySelectorAll('[data-tab]')){const active=b.dataset.tab===tab;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;$('panel-'+b.dataset.tab).hidden=!active}if(tab==='meetings')renderMeetings();if(tab==='doctors')renderDoctorStats()}
for(const b of document.querySelectorAll('[data-tab]'))b.addEventListener('click',()=>showTab(b.dataset.tab));

function render(){
 const month=$('month').value;const [y,m]=month.split('-').map(Number);
 const rows=schedule.meetings.filter(e=>e.date.slice(0,7)===month).sort((a,b)=>a.date.localeCompare(b.date));
 const byDate=new Map(rows.map(e=>[e.date,e]));
 const first=new Date(Date.UTC(y,m-1,1));const lastDay=new Date(Date.UTC(y,m,0)).getUTCDate();
 const firstMonday=1-((first.getUTCDay()+6)%7);
 let calendar='';let week=0;
 for(let monday=firstMonday;monday<=lastDay;monday+=7){
   const cells=[1,2,3].map(offset=>{
     const day=monday+offset;if(day<1||day>lastDay)return '<td></td>';
     const key=dateKey(y,m,day),e=byDate.get(key);
     if(!e)return `<td><div class="date">${pad(m)}-${pad(day)}</div><span class="empty">未排程</span></td>`;
     const t=normalize(e.type),name=e.doctor_name||schedule.doctors?.[e.doctor_id]||e.doctor_id||'';
     const bg=safeColor(schedule.meeting_colors?.[t]||schedule.meeting_colors?.[e.type],'#dbeafe');
     const doctorBg=safeColor(schedule.doctor_colors?.[e.doctor_id],'#334155');
     const doctorLabel=t==='停會'?'':`<span class="doctor" style="background:${doctorBg}">${escapeHTML(name)}</span>`;
     return `<td><div class="date">${pad(m)}-${pad(day)}</div><div class="meeting" style="background:${bg}"><div class="meeting-title">${escapeHTML(t)}</div>${doctorLabel}</div></td>`;
   }).join('');
   calendar+=`<tr><td class="week">第 ${++week} 週</td>${cells}</tr>`;
 }
 $('calendarBody').innerHTML=calendar;
 const typeCounts=new Map();const total=new Map();const fair=new Map();
 for(const e of rows){const t=normalize(e.type),d=e.doctor_id;
  typeCounts.set(t,(typeCounts.get(t)||0)+1);if(!isActive(e))continue;total.set(d,(total.get(d)||0)+1);
  if(t!=='科事務會議'&&t!=='RRC會議')fair.set(d,(fair.get(d)||0)+1);
 }
 const types=meetingTypes();
 $('typeBody').innerHTML=types.map(t=>`<tr><td>${escapeHTML(t)}</td><td class="number">${typeCounts.get(t)||0}</td></tr>`).join('');
 $('typeSummary').textContent=`本月共 ${rows.filter(isActive).length} 場會議，停會 ${rows.filter(e=>normalize(e.type)==='停會').length} 次`;
 const doctorIds=[...new Set([...Object.keys(schedule.doctors||{}),...rows.filter(isActive).map(e=>e.doctor_id)])];
 doctorIds.sort((a,b)=>a.localeCompare(b));
 $('doctorBody').innerHTML=doctorIds.map(d=>{
  const name=schedule.doctors?.[d]||rows.find(e=>e.doctor_id===d)?.doctor_name||d;
  const color=safeColor(schedule.doctor_colors?.[d],'#334155');
  const disabled=schedule.enabled?.[d]===false?'（停用）':'';
  return `<tr><td><span class="name-chip" style="background:${color}">${escapeHTML(name)}</span> ${disabled}</td><td class="number">${total.get(d)||0}</td><td class="number">${fair.get(d)||0}</td></tr>`;
 }).join('');
 $('status').textContent=`${month} · 共 ${rows.filter(isActive).length} 場會議`;
}
fetch('./schedule.json?v=fix2',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}：找不到 schedule.json`);return r.json()}).then(data=>{
 if(!Array.isArray(data.meetings))throw Error('schedule.json 缺少 meetings 陣列');
 schedule=data;
  schedule.meetings=schedule.meetings.filter(e=>e&&typeof e==='object'&&typeof e.date==='string'&&typeof e.type==='string');
  schedule.meeting_order=Array.isArray(schedule.meeting_order)?schedule.meeting_order.filter(t=>typeof t==='string'):[];
  schedule.doctors=(schedule.doctors&&typeof schedule.doctors==='object')?schedule.doctors:{};
 const months=[...new Set(data.meetings.filter(e=>e&&e.date).map(e=>String(e.date).slice(0,7)))].sort();
 if(!months.length)throw Error('沒有可顯示的排程');
 $('month').innerHTML=months.map(m=>`<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join('');
 $('month').addEventListener('change',render);
 const typeOptions=['全部',...meetingTypes()];$('meetingType').innerHTML=typeOptions.map(t=>`<option value="${escapeHTML(t)}">${escapeHTML(t)}</option>`).join('');
 for(const id of ['meetingMonth','statsMonth'])$(id).innerHTML=['全部',...months].map(m=>`<option value="${escapeHTML(m)}">${escapeHTML(m==='全部'?'全部月份':m)}</option>`).join('');
 const ids=[...new Set([...Object.keys(schedule.doctors||{}),...schedule.meetings.filter(isActive).map(e=>e.doctor_id)])].sort();
 $('statsDoctor').innerHTML='<option value="全部">全部醫師</option>'+ids.map(d=>`<option value="${escapeHTML(d)}">${escapeHTML(schedule.doctors?.[d]||schedule.meetings.find(e=>isActive(e)&&e.doctor_id===d)?.doctor_name||d)}</option>`).join('');
 $('meetingType').addEventListener('change',renderMeetings);$('meetingMonth').addEventListener('change',renderMeetings);$('statsDoctor').addEventListener('change',renderDoctorStats);$('statsMonth').addEventListener('change',renderDoctorStats);
 render();renderMeetings();renderDoctorStats();
}).catch(e=>{console.error('晨會網站錯誤',e);$('status').innerHTML=`<div class="error">網站修正版 2 · 無法讀取排程：${escapeHTML(e.message)}<pre style="white-space:pre-wrap;font-size:12px">${escapeHTML(e.stack||'')}</pre></div>`;});
</script>
</body></html>
