<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>眼科晨會行事曆</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--line:#374151;--text:#f9fafb;--muted:#cbd5e1;--accent:#93c5fd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.5}
main{max-width:1500px;margin:auto;padding:26px 22px 50px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:18px}h1{font-size:clamp(22px,3vw,30px);margin:0}h2{font-size:17px;margin:0 0 14px}.sub{color:var(--muted);font-size:13px;margin:3px 0 0}.controls{display:flex;align-items:center;gap:10px}select{background:#273449;color:#fff;border:1px solid #607087;border-radius:8px;padding:10px 14px;font-size:15px;min-width:145px}section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;min-width:0}.scroll{overflow-x:auto}table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left}th{font-weight:650;color:#e5e7eb;background:#2b3748}tr:last-child td{border-bottom:0}.calendar{table-layout:fixed;min-width:620px}.calendar th:first-child{width:95px}.calendar td{height:115px;vertical-align:top;border-right:1px solid var(--line)}.calendar td:last-child{border-right:0}.calendar .week{color:#d1d5db;font-weight:650;vertical-align:middle;background:#253142}.date{font-size:12px;color:#cbd5e1;margin-bottom:8px}.meeting{padding:10px;border-radius:8px;color:#111827;min-height:74px;overflow-wrap:anywhere}.meeting-title{font-weight:700;font-size:13px}.doctor{display:inline-block;margin-top:7px;padding:2px 7px;border-radius:5px;color:#fff;font-size:12px;font-weight:700}.empty{color:#64748b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stats section{margin:0}.number{text-align:right;font-variant-numeric:tabular-nums}.name-chip{display:inline-block;padding:3px 8px;border-radius:6px;font-weight:650;color:#fff}.summary{font-size:13px;color:var(--muted);margin-top:12px}.error{padding:14px;background:#4b2525;border:1px solid #a65c5c;border-radius:8px}.legend{color:var(--muted);font-size:12px;margin-top:8px}@media(max-width:780px){main{padding:16px 12px}.stats{grid-template-columns:1fr}section{padding:13px}.calendar td{padding:8px}.calendar th:first-child{width:70px}}
</style>
</head>
<body><main>
<header><div><h1>眼科晨會行事曆</h1><p class="sub">每週二、三、四 · 排程與醫師負責場次</p></div><div class="controls"><label for="month">月份</label><select id="month" aria-label="選擇月份"></select></div></header>
<div id="status" class="sub" role="status">正在載入排程…</div>
<section aria-label="每週行事曆"><h2>每週晨會行事曆</h2><div class="scroll"><table class="calendar"><thead><tr><th>週次</th><th>星期二</th><th>星期三</th><th>星期四</th></tr></thead><tbody id="calendarBody"></tbody></table></div><div class="legend">會議顏色與醫師顏色沿用 Python 排程設定。</div></section>
<div class="stats"><section><h2>本月各會議數量</h2><div class="scroll"><table><thead><tr><th>會議種類</th><th class="number">場次</th></tr></thead><tbody id="typeBody"></tbody></table></div><p class="summary" id="typeSummary"></p></section><section><h2>本月各醫師場次</h2><div class="scroll"><table><thead><tr><th>醫師姓名</th><th class="number">全部場次</th><th class="number">平均分配計數</th></tr></thead><tbody id="doctorBody"></tbody></table></div><p class="summary">平均分配計數不含行政會議及 RRC 會議；停用醫師若仍有排程，也會顯示。</p></section></div>
</main>
<script>
'use strict';
const DEFAULT_ORDER=['RRC會議','行政會議','VS Research Meeting','病例/期刊論文討論','併發症討論','影像討論','TransPRK教學','專題演講'];
const MERGED=new Set(['病例討論','臨床病例討論','臨床教學','文獻討論','核心課程']);
const normalize=t=>MERGED.has(t)?'病例/期刊論文討論':t;
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeColor=(v,fallback)=>typeof v==='string'&&/^#[0-9a-fA-F]{3,8}$/.test(v)?v:fallback;
const pad=n=>String(n).padStart(2,'0');
const dateKey=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const $=id=>document.getElementById(id);
let schedule;
function render(){
 const month=$('month').value;const [y,m]=month.split('-').map(Number);
 const rows=schedule.meetings.filter(e=>e.date.slice(0,7)===month).sort((a,b)=>a.date.localeCompare(b.date));
 const byDate=new Map(rows.map(e=>[e.date,e]));
 const first=new Date(Date.UTC(y,m-1,1));const lastDay=new Date(Date.UTC(y,m,0)).getUTCDate();
 const firstMonday=1-((first.getUTCDay()+6)%7);
 let calendar='';let week=0;
 for(let monday=firstMonday;monday<=lastDay;monday+=7){
   const cells=[1,2,3].map(offset=>{
     const day=monday+offset;if(day<1||day>lastDay)return '<td></td>';
     const key=dateKey(y,m,day),e=byDate.get(key);
     if(!e)return `<td><div class="date">${pad(m)}-${pad(day)}</div><span class="empty">—</span></td>`;
     const t=normalize(e.type),name=e.doctor_name||schedule.doctors?.[e.doctor_id]||e.doctor_id||'';
     const bg=safeColor(schedule.meeting_colors?.[t]||schedule.meeting_colors?.[e.type],'#dbeafe');
     const doctorBg=safeColor(schedule.doctor_colors?.[e.doctor_id],'#334155');
     return `<td><div class="date">${pad(m)}-${pad(day)}</div><div class="meeting" style="background:${bg}"><div class="meeting-title">${escapeHTML(t)}</div><span class="doctor" style="background:${doctorBg}">${escapeHTML(name)}</span></div></td>`;
   }).join('');
   calendar+=`<tr><td class="week">第 ${++week} 週</td>${cells}</tr>`;
 }
 $('calendarBody').innerHTML=calendar;
 const typeCounts=new Map();const total=new Map();const fair=new Map();
 for(const e of rows){const t=normalize(e.type),d=e.doctor_id;
  typeCounts.set(t,(typeCounts.get(t)||0)+1);total.set(d,(total.get(d)||0)+1);
  if(t!=='行政會議'&&t!=='RRC會議')fair.set(d,(fair.get(d)||0)+1);
 }
 const types=[...new Set([...DEFAULT_ORDER,...(schedule.meeting_order||[]).map(normalize),...typeCounts.keys()])];
 types.sort((a,b)=>{const ai=DEFAULT_ORDER.indexOf(a),bi=DEFAULT_ORDER.indexOf(b);return (ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b,'zh-Hant')});
 $('typeBody').innerHTML=types.map(t=>`<tr><td>${escapeHTML(t)}</td><td class="number">${typeCounts.get(t)||0}</td></tr>`).join('');
 $('typeSummary').textContent=`本月共 ${rows.length} 場會議`;
 const doctorIds=[...new Set([...Object.keys(schedule.doctors||{}),...rows.map(e=>e.doctor_id)])];
 doctorIds.sort((a,b)=>a.localeCompare(b));
 $('doctorBody').innerHTML=doctorIds.map(d=>{
  const name=schedule.doctors?.[d]||rows.find(e=>e.doctor_id===d)?.doctor_name||d;
  const color=safeColor(schedule.doctor_colors?.[d],'#334155');
  const disabled=schedule.enabled?.[d]===false?'（停用）':'';
  return `<tr><td><span class="name-chip" style="background:${color}">${escapeHTML(name)}</span> ${disabled}</td><td class="number">${total.get(d)||0}</td><td class="number">${fair.get(d)||0}</td></tr>`;
 }).join('');
 $('status').textContent=`${month} · 共 ${rows.length} 場`;
}
fetch('./schedule.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}：找不到 schedule.json`);return r.json()}).then(data=>{
 if(!Array.isArray(data.meetings))throw Error('schedule.json 缺少 meetings 陣列');
 schedule=data;
 const months=[...new Set(data.meetings.map(e=>String(e.date).slice(0,7)))].sort();
 if(!months.length)throw Error('沒有可顯示的排程');
 $('month').innerHTML=months.map(m=>`<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join('');
 $('month').addEventListener('change',render);render();
}).catch(e=>{$('status').innerHTML=`<div class="error">無法讀取排程：${escapeHTML(e.message)}。請確認 index.html 與 schedule.json 位於同一個 Repository 根目錄，並透過 GitHub Pages 開啟。</div>`});
</script>
</body></html>
