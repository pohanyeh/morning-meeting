<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>眼科晨會行事曆</title><style>
body{font-family:system-ui,"Microsoft JhengHei",sans-serif;margin:24px auto;padding:0 16px;max-width:1150px;color:#172033;background:#f8fafc}h1{font-size:26px}select{padding:8px;border:1px solid #cbd5e1;border-radius:7px}table{width:100%;border-collapse:collapse;background:white;margin:12px 0 28px}th,td{border:1px solid #dbe3eb;padding:10px;text-align:left;vertical-align:top}th{background:#e8eef5}.meeting{border-radius:6px;padding:9px;margin:3px 0;color:#111827}.doctor{font-weight:750}section{margin-top:28px}#status{color:#64748b}.scroll{overflow-x:auto}
</style></head><body><h1>眼科晨會行事曆</h1><p id="status">讀取排程中…</p><label>月份 <select id="month"></select></label><section><h2>每週二、三、四</h2><div class="scroll"><table id="calendar"><thead><tr><th>週次</th><th>星期二</th><th>星期三</th><th>星期四</th></tr></thead><tbody></tbody></table></div></section><section><h2>當月會議清單</h2><div class="scroll"><table id="list"><thead><tr><th>日期</th><th>會議</th><th>負責醫師</th></tr></thead><tbody></tbody></table></div></section><section><h2>各會議數量</h2><div id="types"></div><h2>各醫師場次</h2><div id="doctors"></div></section><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;
const tbody=id=>document.querySelector('#'+id+' tbody');
function render(){const m=document.querySelector('#month').value;const rows=data.meetings.filter(x=>x.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date));const bydate=Object.fromEntries(rows.map(x=>[x.date,x]));const [y,mo]=m.split('-').map(Number);const first=new Date(y,mo-1,1);const last=new Date(y,mo,0);let mon=new Date(first);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));let html='';let week=0;
while(mon<=last){const cells=[1,2,3].map(offset=>{const d=new Date(mon);d.setDate(mon.getDate()+offset);if(d.getMonth()!==mo-1)return '<td></td>';const key=`${y}-${String(mo).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const e=bydate[key];if(!e)return `<td>${esc(key.slice(5))}<div>—</div></td>`;return `<td>${esc(key.slice(5))}<div class="meeting" style="background:${data.meeting_colors[e.type]||'#eee'}">${esc(e.type)}<div class="doctor" style="color:${data.doctor_colors[e.doctor_id]||'#111'}">${esc(e.doctor_name)}</div></div></td>`});if(cells.some(c=>c.includes('<td>')&&!c.includes('<td></td>')))html+=`<tr><th>第${++week}週</th>${cells.join('')}</tr>`;mon.setDate(mon.getDate()+7)}tbody('calendar').innerHTML=html;
tbody('list').innerHTML=rows.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.type)}</td><td style="color:${data.doctor_colors[e.doctor_id]||'#111'}">${esc(e.doctor_name)}</td></tr>`).join('');
const typeCount={};const docCount={};const fairCount={};for(const e of rows){typeCount[e.type]=(typeCount[e.type]||0)+1;docCount[e.doctor_id]=(docCount[e.doctor_id]||0)+1;if(!['RRC會議','行政會議'].includes(e.type))fairCount[e.doctor_id]=(fairCount[e.doctor_id]||0)+1}
document.querySelector('#types').innerHTML='<table><tr><th>會議種類</th><th>場次</th></tr>'+data.meeting_order.map(t=>`<tr><td>${esc(t)}</td><td>${typeCount[t]||0}</td></tr>`).join('')+'</table>';
document.querySelector('#doctors').innerHTML='<table><tr><th>醫師</th><th>全部場次</th><th>不含行政/RRC</th></tr>'+Object.keys(data.doctors).map(d=>`<tr><td style="color:${data.doctor_colors[d]||'#111'}">${esc(data.doctors[d])}</td><td>${docCount[d]||0}</td><td>${fairCount[d]||0}</td></tr>`).join('')+'</table>';document.querySelector('#status').textContent=`${m}：共 ${rows.length} 場`}
fetch('./schedule.json').then(r=>{if(!r.ok)throw Error('找不到 schedule.json');return r.json()}).then(x=>{data=x;const months=[...new Set(data.meetings.map(e=>e.date.slice(0,7)))].sort();document.querySelector('#month').innerHTML=months.map(m=>`<option>${esc(m)}</option>`).join('');document.querySelector('#month').addEventListener('change',render);render()}).catch(err=>{document.querySelector('#status').textContent='載入失敗：'+err.message+'。請使用 GitHub Pages 或本機 HTTP 伺服器開啟。'});
</script></body></html>
